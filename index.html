<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Kitchen">
<meta name="theme-color" content="#F6F1E8">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Our Kitchen</title>
<script src="firebase-config.js"></script>
<style>
:root{
  --bg:#F6F1E8; --card:#FFFFFF; --ink:#2A2824; --muted:#8B857A; --line:#E8E1D4;
  --accent:#2F6B4F; --accent-soft:#E3EEE7; --warm:#C2643A; --warm-soft:#F7E6DC;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:130px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--safe-t) + 12px) 18px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:26px;letter-spacing:-.4px;margin:0;flex:1;font-family:ui-serif,Georgia,serif;font-weight:600}
.backbtn{display:inline-flex;align-items:center;gap:2px;font-size:17px;font-weight:600;color:var(--accent);padding:6px 10px 6px 4px;margin-left:-6px}
.backbtn .ch{font-size:26px;line-height:1;margin-top:-2px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:2}
.sheet-top .x{font-size:15px;color:var(--muted);padding:6px 4px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}
main{padding:0 14px calc(96px + var(--safe-b))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safe-b))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav button .i{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--accent);font-weight:600}
nav button.on .i{filter:none;opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
.weeknav b{font-size:15px}
.weeknav button{padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day-h .dn{font-weight:700}
.day-h .dd{color:var(--muted);font-size:14px;flex:1}
.pill{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:5px 11px}
.meal{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--warm);background:var(--warm-soft);border-radius:6px;padding:2px 6px;flex:none}
.meal .mn{flex:1;font-weight:500}
.meal.cooked .mn{text-decoration:line-through;color:var(--muted)}
.mini{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:14px;color:var(--muted);flex:none}
.mini.done{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--muted);font-size:14px;padding:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:#B23B2E;border:1px solid #EBC9C4}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.list-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 4px 8px;font-weight:600}
.store-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.store-h b{font-size:17px;flex:1}
.count{font-size:12px;color:var(--muted)}
.aisle{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 2px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;font-size:15px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.shop-item.on .nm{text-decoration:line-through;color:var(--muted)}
.qty{font-weight:600;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.75}
.search{margin-bottom:10px}
.banner{background:var(--warm-soft);color:#7A3D20;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 0}
.sheet-bg{position:fixed;inset:0;background:rgba(30,25,20,.35);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet h2{font-size:20px;margin:0 0 12px;font-family:ui-serif,Georgia,serif}
.sheet label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.seg{display:flex;background:#ECE5D8;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 0;border-radius:8px;font-size:14px}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ing{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing .q{min-width:74px;font-weight:600;color:var(--accent)}
.steps{white-space:pre-wrap}
.prep{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-radius:6px;padding:2px 7px;flex:none}
.prep-easy{background:#E3EEE7;color:#2F6B4F}.prep-medium{background:#F6EBCB;color:#8A6410}.prep-hard{background:#F7E0DA;color:#A23D2B}
.stack > * + *{margin-top:8px}
.login{max-width:380px;margin:12vh auto 0;padding:0 20px}
.login h1{font-family:ui-serif,Georgia,serif;font-size:32px;margin:0 0 6px}
.err{color:#B23B2E;font-size:14px;min-height:20px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MEALS = ['Breakfast','Lunch','Dinner','Snack'];
const COMMON_SPICES = ['Salt','Sea salt','Kosher salt','Black pepper','Garlic powder','Onion powder','Paprika','Smoked paprika','Cumin','Chili powder',
  'Cayenne pepper','Red pepper flakes','Oregano','Basil','Thyme','Rosemary','Dried parsley','Dill','Sage','Bay leaf','Italian seasoning',
  'Cinnamon','Nutmeg','Ground ginger','Ground cloves','Allspice','Pumpkin pie spice','Curry powder','Turmeric','Coriander','Everything bagel seasoning'];
const PREPS = [['easy','Easy prep'],['medium','Medium prep'],['hard','Hard prep']];
const prepBadge = p => p ? `<span class="prep prep-${p}">${{easy:'Easy',medium:'Medium',hard:'Hard'}[p]}</span>` : '';
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }

/* ============ ingredient parsing & units ============ */
const UNITS = {tsp:'tsp',t:'tsp',teaspoon:'tsp',teaspoons:'tsp',tbsp:'tbsp',tbs:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',
  cup:'cup',cups:'cup',c:'cup',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',g:'g',gram:'g',grams:'g',
  kg:'kg',ml:'ml',l:'l',liter:'l',liters:'l',can:'can',cans:'can',clove:'clove',cloves:'clove',pkg:'pkg',package:'pkg',packages:'pkg',
  bunch:'bunch',bunches:'bunch',head:'head',heads:'head',jar:'jar',jars:'jar',bag:'bag',bags:'bag',box:'box',boxes:'box',
  bottle:'bottle',bottles:'bottle',slice:'slice',slices:'slice',pinch:'pinch',dozen:'dozen',stick:'stick',sticks:'stick',
  piece:'',pieces:'',each:'',whole:'',large:'',medium:'',small:''};
const FRAC = {'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125};
const FAM = {tsp:['v',1],tbsp:['v',3],cup:['v',48],'fl oz':['v',6],ml:['v',0.202884],l:['v',202.884],oz:['w',1],lb:['w',16],g:['w',0.035274],kg:['w',35.274]};
const famOf = u => FAM[u] ? FAM[u][0] : 'u:' + (u || '');
const toBase = (q, u) => FAM[u] ? q * FAM[u][1] : q;
function fromBase(q, fam){
  if (fam === 'w') return q >= 16 ? [q/16, 'lb'] : [q, 'oz'];
  if (fam === 'v') return q >= 12 ? [q/48, 'cup'] : q >= 3 ? [q/3, 'tbsp'] : [q, 'tsp'];
  return [q, fam.slice(2)];
}
function fmtNum(n){
  if (n == null || isNaN(n)) return '';
  const w = Math.floor(n + 1e-9), f = n - w;
  const nice = [[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
  for (const [v, s] of nice) if (Math.abs(f - v) < 0.03) {
    if (v === 1) return String(w + 1);
    return (w ? w : (s ? '' : '0')) + s;
  }
  return String(Math.round(n * 100) / 100);
}
const PLURAL = {clove:'cloves',head:'heads',can:'cans',jar:'jars',bag:'bags',bottle:'bottles',slice:'slices',stick:'sticks',bunch:'bunches',box:'boxes',pkg:'pkgs',cup:'cups'};
const fmtQty = (q, u) => q == null ? '' : `${fmtNum(q)}${u ? ' ' + (q > 1 && PLURAL[u] ? PLURAL[u] : u) : ''}`;
function normName(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function singular(w){
  if (w.length <= 3) return w;
  if (/ies$/.test(w)) return w.slice(0,-3) + 'y';
  if (/oes$/.test(w)) return w.slice(0,-2);
  if (/(ches|shes|xes|sses)$/.test(w)) return w.slice(0,-2);
  if (/s$/.test(w) && !/ss$/.test(w)) return w.slice(0,-1);
  return w;
}
const keyOf = name => normName(name).split(' ').map((w,i,a) => i === a.length-1 ? singular(w) : w).join(' ');
function normUnit(u){ u = String(u||'').toLowerCase().replace(/\.$/,'').trim(); if (u === 'fl oz' || u === 'floz') return 'fl oz'; return u in UNITS ? UNITS[u] : u; }
function parseNum(tok){
  if (/^\d+\/\d+$/.test(tok)) { const [a,b] = tok.split('/').map(Number); return b ? a/b : null; }
  if (/^\d*\.?\d+$/.test(tok)) return parseFloat(tok);
  return null;
}
function parseLine(line){
  let t = line.trim().replace(/^[-•*]\s*/, '');
  if (!t) return null;
  const raw = t;
  for (const [k, v] of Object.entries(FRAC)) t = t.split(k).join(' ' + v + ' ');
  t = t.replace(/^(\d+(?:\.\d+)?)([a-zA-Z]+)\b/, '$1 $2');      // "2lb chicken"
  t = t.replace(/(\d)\s*-\s*(\d)/, '$1 - $2');                   // "2-3"
  let toks = t.split(/\s+/).filter(Boolean), qty = null, i = 0;
  while (i < toks.length) {
    const n = parseNum(toks[i]);
    if (n == null) break;
    qty = (qty || 0) + n; i++;
    if ((toks[i] === '-' || toks[i] === 'to') && parseNum(toks[i+1] || '') != null) { qty = parseNum(toks[i+1]); i += 2; } // ranges: take the higher
  }
  let unit = '';
  if (qty != null && i < toks.length) {
    const two = (toks[i] + ' ' + (toks[i+1]||'')).toLowerCase();
    if (two === 'fl oz' || two === 'fl. oz') { unit = 'fl oz'; i += 2; }
    else { const u = toks[i].toLowerCase().replace(/\.$/, ''); if (u in UNITS) { unit = UNITS[u]; i++; } }
  }
  let rest = toks.slice(i).join(' ').replace(/^of\s+/i, '');
  rest = rest.replace(/\([^)]*\)/g, ' ');
  let note = '';
  const ci = rest.indexOf(',');
  if (ci > 0) { note = rest.slice(ci + 1).trim(); rest = rest.slice(0, ci); }
  const name = rest.replace(/\s+/g, ' ').trim() || raw;
  return { raw, qty, unit, name, note, key: keyOf(name) };
}

/* ============ storage: local (this device) or Firebase (shared) ============ */
const COLS = ['recipes','items','pantry','plan','stores','checks'];
function LocalStore(){
  const mem = {}, cbs = {};
  const load = c => { try { const v = localStorage.getItem('ok_' + c); if (v) return JSON.parse(v); } catch(e){} return mem[c] || {}; };
  const save = (c, d) => { mem[c] = d; try { localStorage.setItem('ok_' + c, JSON.stringify(d)); } catch(e){} };
  return {
    mode: 'local', user: null,
    async start(){},
    subscribe(c, cb){ cbs[c] = cb; cb(load(c)); },
    async put(c, id, obj){ const d = load(c); d[id] = JSON.parse(JSON.stringify(obj)); save(c, d); cbs[c] && cbs[c](d); },
    async del(c, id){ const d = load(c); delete d[id]; save(c, d); cbs[c] && cbs[c](d); },
    async signOut(){}
  };
}
async function FirebaseStore(cfg, household){
  const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [A, F, Au] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-firestore.js'), import(base+'firebase-auth.js')]);
  const app = A.initializeApp(cfg);
  const auth = Au.getAuth(app);
  let db; try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache() }); } catch(e) { db = F.getFirestore(app); }
  const col = c => F.collection(db, 'households', household, c);
  const store = {
    mode: 'firebase', user: null,
    start(){
      return new Promise(resolve => {
        Au.onAuthStateChanged(auth, u => {
          if (u) { store.user = u.email; resolve(); }
          else showLogin(async (email, pw) => { await Au.signInWithEmailAndPassword(auth, email, pw); });
        });
      });
    },
    subscribe(c, cb){
      F.onSnapshot(col(c), snap => { const d = {}; snap.forEach(x => d[x.id] = x.data()); cb(d); },
        err => { console.error(err); toast('Sync error: ' + (err.code || err.message)); });
    },
    put(c, id, obj){ return F.setDoc(F.doc(db, 'households', household, c, id), JSON.parse(JSON.stringify(obj))); },
    del(c, id){ return F.deleteDoc(F.doc(db, 'households', household, c, id)); },
    async signOut(){ await Au.signOut(auth); location.reload(); }
  };
  return store;
}
function showLogin(onSubmit){
  $('#app').innerHTML = `<div class="login">
    <h1>Our Kitchen</h1><p class="sub">Sign in to see your shared meal plan.</p>
    <form id="lf" class="stack" style="margin-top:20px">
      <input id="le" type="email" autocomplete="username" placeholder="Email" required>
      <input id="lp" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn" type="submit">Sign in</button>
      <div class="err" id="lerr"></div>
    </form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); $('#lerr').textContent = '';
    try { await onSubmit($('#le').value.trim(), $('#lp').value); }
    catch(err){ $('#lerr').textContent = 'Couldn’t sign in — check the email and password.'; }
  };
}

/* ============ state ============ */
const S = { recipes:{}, items:{}, pantry:{}, plan:{}, stores:{}, checks:{} };
let DB, pantryView = 'food', spiceQuery = '', tabHist = [], sheetStack = [], prepFilter = '', editPrep = '', tab = 'plan', weekStart = mondayOf(new Date()), shopSel = null, recipeQuery = '', ready = false, pending = false;
try { const t = localStorage.getItem('ok_tab'); if (t) tab = t; } catch(e){}

function onData(c, d){
  S[c] = d || {};
  if (!ready) return;
  const a = document.activeElement;
  if (a && $('#main') && $('#main').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pending = true; return; }
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pending) { pending = false; render(); } }, 50));

async function ensureItem(name, key){
  if (!S.items[key]) await DB.put('items', key, { name, storeId: '', aisles: {} });
}
const storeList = () => Object.entries(S.stores).sort((a,b) => (a[1].order ?? 99) - (b[1].order ?? 99) || a[1].name.localeCompare(b[1].name));
const aisleOf = it => (it && it.storeId && it.aisles && it.aisles[it.storeId]) || '';
const planFor = ds => Object.entries(S.plan).filter(([,e]) => e.date === ds).sort((a,b) => MEALS.indexOf(a[1].meal) - MEALS.indexOf(b[1].meal));

/* ============ shopping math ============ */
function computeShopping(dates){
  const need = {}; let meals = 0;
  for (const [, e] of Object.entries(S.plan)) {
    if (!dates.has(e.date) || e.cooked) continue;
    const r = S.recipes[e.recipeId]; if (!r) continue;
    meals++;
    const mult = e.mult || 1;
    for (const ing of r.ingredients || []) {
      const n = need[ing.key] ||= { key: ing.key, name: S.items[ing.key]?.name || ing.name, fams: {}, noQty: false, from: new Set() };
      n.from.add(r.name);
      if (ing.qty == null) n.noQty = true;
      else { const f = famOf(ing.unit); n.fams[f] = (n.fams[f] || 0) + toBase(ing.qty * mult, ing.unit); }
    }
  }
  const buy = [], covered = [];
  for (const n of Object.values(need)) {
    const p = S.pantry[n.key];
    let have = '';
    if (p) {
      if (p.qty === '' || p.qty == null) { covered.push({ ...n, have: 'in stock' }); continue; }
      have = fmtQty(+p.qty, p.unit);
      const pf = famOf(p.unit);
      if (n.fams[pf] != null) n.fams[pf] = Math.max(0, n.fams[pf] - toBase(+p.qty, p.unit));
      else if (!Object.keys(n.fams).length) { covered.push({ ...n, have }); continue; }
    }
    const lines = Object.entries(n.fams).filter(([, q]) => q > 1e-6).map(([f, q]) => { const [v, u] = fromBase(q, f); return { q: v, u, fam: f, base: q }; });
    if (!lines.length && !(n.noQty && !p && !Object.keys(n.fams).length)) { covered.push({ ...n, have }); continue; }
    buy.push({ ...n, lines, have });
  }
  return { buy, covered, meals };
}

/* ============ rendering ============ */
function render(){
  const titles = { plan:'Meal Plan', recipes:'Recipes', shop:'Grocery List', pantry:'Pantry', stores:'Stores' };
  $('#app').innerHTML = `

function viewSpices(){
  const q = normName(spiceQuery);
  const usedBy = {};
  for (const r of Object.values(S.recipes)) for (const i of r.ingredients || []) if (isSpice(i.key)) (usedBy[i.key] ||= new Set()).add(r.name);
  const names = {};
  for (const n of COMMON_SPICES) names[keyOf(n)] = n;
  for (const [k, it] of Object.entries(S.items)) if (isSpice(k)) names[k] = it.name;
  for (const [k, p] of Object.entries(S.pantry)) if (isSpice(k)) names[k] = p.name;
  const match = k => !q || normName(names[k]).includes(q);
  const cap = n => n.charAt(0).toUpperCase() + n.slice(1);
  const recipeKeys = Object.keys(usedBy).filter(match).sort((a, b) => names[a].localeCompare(names[b]));
  const otherKeys = Object.keys(names).filter(k => !usedBy[k] && match(k)).sort((a, b) => (!!S.pantry[b] - !!S.pantry[a]) || names[a].localeCompare(names[b]));
  const haveCount = Object.keys(names).filter(k => S.pantry[k]).length;
  let h = `<div class="row" style="margin-bottom:10px"><input id="spq" placeholder="Search or add a spice" value="${esc(spiceQuery)}" autocomplete="off"></div>

  if (!recipeKeys.length && !otherKeys.length && !q) h += `<div class="empty">No spices yet.</div>`;
  return h;
}

/* ============ actions ============ */
async function subtractFromPantry(r, mult){
  for (const ing of r.ingredients || []) {
    const p = S.pantry[ing.key];
    if (!p || p.qty === '' || p.qty == null || ing.qty == null) continue;
    if (famOf(p.unit) !== famOf(ing.unit)) continue;
    const left = toBase(+p.qty, p.unit) - toBase(ing.qty * mult, ing.unit);
    if (left <= 1e-6) await DB.del('pantry', ing.key);
    else await DB.put('pantry', ing.key, { ...p, qty: Math.round(left / (FAM[p.unit]?.[1] || 1) * 100) / 100 });
  }
}
async function addToPantry(key, name, lines){
  const p = S.pantry[key];
  if (p && (p.qty === '' || p.qty == null)) return;
  if (!lines.length) { if (!p) await DB.put('pantry', key, { name, qty: '', unit: '' }); return; }
  if (p) {
    const pf = famOf(p.unit), l = lines.find(x => x.fam === pf);
    if (l) { const tot = toBase(+p.qty, p.unit) + l.base; await DB.put('pantry', key, { ...p, qty: Math.round(tot / (FAM[p.unit]?.[1] || 1) * 100) / 100 }); return; }
  }
  const l = lines[0];
  await DB.put('pantry', key, { name, qty: Math.round(l.q * 100) / 100, unit: l.u });
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, key = el.dataset.key;
  switch (a) {
    case 'tab': if (el.dataset.tab === tab) break; tabHist.push(tab); if (tabHist.length > 20) tabHist.shift(); tab = el.dataset.tab; try { localStorage.setItem('ok_tab', tab); } catch(e){} window.scrollTo(0, 0); render(); break;
    case 'week': weekStart = addDays(weekStart, +el.dataset.d); shopSel = null; render(); break;
    case 'settings': pushSheet(() => sheetSettings()); break;
    case 'sheetBack': sheetBack(); break;
    case 'tabBack': tab = tabHist.pop() || 'plan'; try { localStorage.setItem('ok_tab', tab); } catch(e){} window.scrollTo(0, 0); render(); break;
    case 'close': closeSheet(); break;
    case 'addMeal': { const d = el.dataset.date; pushSheet(() => sheetAddMeal(d)); break; }
    case 'pickMealType': addMealState.meal = el.dataset.m; $('#mealSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'pickMult': addMealState.mult = +el.dataset.m; $('#multSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'planRecipe': await DB.put('plan', uid(), { date: addMealState.date, meal: addMealState.meal, recipeId: id, mult: addMealState.mult, cooked: false }); shopSel = null; closeSheet(); toast('Added to plan'); break;
    case 'newRecipeFromPlan': closeSheet(); tabHist.push(tab); tab = 'recipes'; render(); pushSheet(() => sheetEditRecipe()); break;
    case 'rmMeal': await DB.del('plan', id); shopSel = null; break;
    case 'cook': {
      const ent = S.plan[id]; if (!ent) break;
      const r = S.recipes[ent.recipeId];
      if (!ent.cooked && r) { await subtractFromPantry(r, ent.mult || 1); toast('Marked cooked — pantry updated'); }
      await DB.put('plan', id, { ...ent, cooked: !ent.cooked });
      break;
    }
    case 'viewRecipe': pushSheet(() => sheetRecipe(id)); break;
    case 'prepFilter': prepFilter = el.dataset.p; render(); break;
    case 'pickPrep': editPrep = editPrep === el.dataset.p ? '' : el.dataset.p; $('#prepSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.p === editPrep)); break;
    case 'editRecipe': pushSheet(() => sheetEditRecipe(id)); break;
    case 'saveRecipe': {
      const name = $('#rn').value.trim();
      if (!name) { $('#rn').focus(); toast('Give it a name'); break; }
      const ingredients = $('#ri').value.split('\n').map(parseLine).filter(Boolean);
      for (const ing of ingredients) await ensureItem(ing.name, ing.key);
      const rid = id || uid();
      await DB.put('recipes', rid, { name, prep: editPrep, servings: $('#rs').value.trim(), ingredients, steps: $('#rd').value.trim() });
      toast('Recipe saved'); if (id && sheetStack.length > 1) sheetBack(); else closeSheet(); if (tab === 'recipes') render();
      break;
    }
    case 'delRecipe':
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; break; }
      await DB.del('recipes', id);
      for (const [pid, pe] of Object.entries(S.plan)) if (pe.recipeId === id) await DB.del('plan', pid);
      closeSheet(); toast('Recipe deleted'); break;
    case 'shopDay': shopDates(); shopSel.has(el.dataset.date) ? shopSel.delete(el.dataset.date) : shopSel.add(el.dataset.date); render(); break;
    case 'check': if (S.checks[key]) await DB.del('checks', key); else await DB.put('checks', key, { on: true, at: Date.now() }); break;
    case 'finishShop': {
      const { buy } = computeShopping(shopSel || new Set());
      let n = 0;
      for (const b of buy) if (S.checks[b.key]) { await addToPantry(b.key, b.name, b.lines); n++; }
      for (const k of Object.keys(S.checks)) await DB.del('checks', k);
      toast(`${n} item${n===1?'':'s'} added to pantry`); break;
    }
    case 'editItem': pushSheet(() => sheetItem(key)); break;
    case 'saveItem': {
      const it = S.items[key] || { name: key, aisles: {} };
      const storeId = $('#is').value, aisles = { ...(it.aisles || {}) };
      if (storeId) aisles[storeId] = $('#ia').value.trim();
      await DB.put('items', key, { ...it, storeId, aisles });
      closeSheet(); break;
    }
    case 'addPantry': {
      const name = $('#pn').value.trim(); if (!name) { $('#pn').focus(); break; }
      const k = keyOf(name), q = $('#pq').value.trim();
      const qty = q === '' ? '' : (parseNum(q.replace(/\s+/g, '')) ?? parseFloat(q));
      await ensureItem(name, k);
      await DB.put('pantry', k, { name: S.items[k]?.name || name, qty: qty === '' || isNaN(qty) ? '' : qty, unit: normUnit($('#pu').value) });
      ['#pn','#pq','#pu'].forEach(x => { const e = $(x); if (e) e.value = ''; }); document.activeElement?.blur(); toast('Added'); break;
    }
    case 'editPantry': pushSheet(() => sheetPantry(key)); break;
    case 'pantryView': pantryView = el.dataset.v; render(); break;
    case 'toggleSpice': {
      if (S.pantry[key]) await DB.del('pantry', key);
      else { await ensureItem(el.dataset.name, key); await DB.put('pantry', key, { name: S.items[key]?.name || el.dataset.name, qty: '', unit: '', spice: true }); }
      break;
    }
    case 'addSpice': {
      const name = $('#spn').value.trim(); if (!name) { $('#spn').focus(); break; }
      const k = keyOf(name);
      await ensureItem(name, k);
      await DB.put('items', k, { ...S.items[k], spice: true });
      await DB.put('pantry', k, { name: S.items[k]?.name || name, qty: '', unit: '', spice: true });
      spiceQuery = ''; document.activeElement?.blur(); render(); toast('Spice added'); break;
    }
    case 'savePantry': { const p = S.pantry[key]; const q = $('#eq').value.trim(); const qty = q === '' ? '' : parseFloat(q);
      await DB.put('pantry', key, { ...p, qty: q === '' || isNaN(qty) ? '' : qty, unit: normUnit($('#eu').value) }); closeSheet(); break; }
    case 'delPantry': await DB.del('pantry', key); closeSheet(); break;
    case 'addStore': { const n = $('#sn').value.trim(); if (!n) break; await DB.put('stores', uid(), { name: n, order: storeList().length }); if ($('#sn')) $('#sn').value = ''; document.activeElement?.blur(); break; }
    case 'editStore': pushSheet(() => sheetStore(id)); break;
    case 'saveStore': { const n = $('#esn').value.trim(); if (n) await DB.put('stores', id, { ...S.stores[id], name: n }); closeSheet(); break; }
    case 'delStore':
      if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; break; }
      await DB.del('stores', id);
      for (const [k, it] of Object.entries(S.items)) if (it.storeId === id) await DB.put('items', k, { ...it, storeId: '' });
      closeSheet(); break;
    case 'exportData': {
      const txt = JSON.stringify(Object.fromEntries(COLS.map(c => [c, S[c]])));
      try { await navigator.clipboard.writeText(txt); toast('Backup copied'); }
      catch(err){ $('#imp').value = txt; $('#imp').select(); toast('Copy the text in the box'); }
      break;
    }
    case 'importData': {
      try {
        const data = JSON.parse($('#imp').value);
        let n = 0;
        for (const c of COLS) for (const [k, v] of Object.entries(data[c] || {})) { await DB.put(c, k, v); n++; }
        closeSheet(); toast(`Imported ${n} records`);
      } catch(err){ toast('That backup couldn’t be read'); }
      break;
    }
    case 'signOut': await DB.signOut(); break;
  }
});

/* ============ boot ============ */
(async function boot(){
  const cfg = window.FIREBASE_CONFIG;
  try { DB = cfg && cfg.apiKey ? await FirebaseStore(cfg, window.HOUSEHOLD_ID || 'home') : LocalStore(); }
  catch(err){ console.error(err); $('#app').innerHTML = `<div class="login"><h1>Our Kitchen</h1><p class="err">Couldn’t connect to Firebase. Check firebase-config.js and your internet connection.</p></div>`; return; }
  await DB.start();
  $('#app').innerHTML = `<div class="login"><p class="sub">Loading…</p></div>`;
  let loaded = 0;
  await new Promise(resolve => {
    for (const c of COLS) { let first = true; DB.subscribe(c, d => { onData(c, d); if (first) { first = false; if (++loaded === COLS.length) resolve(); } }); }
  });
  if (!Object.keys(S.stores).length) {
    await DB.put('stores', 'publix', { name: 'Publix', order: 0 });
    await DB.put('stores', 'sams', { name: "Sam's Club", order: 1 });
  }
  ready = true; render();
})();
</script>
